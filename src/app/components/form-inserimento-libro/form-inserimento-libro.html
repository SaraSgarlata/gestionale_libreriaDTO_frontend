<h2 mat-dialog-title>Inserisci nuovo libro</h2>
<p class="sottotitolo">Compila i dati del libro e dell'autore.</p>

<mat-dialog-content>
  <form [formGroup]="libroForm" (ngSubmit)="onSubmit()" id="formLibro" class="form-libro">

    <mat-form-field appearance="outline" class="campo-intero">
      <mat-label>Titolo</mat-label>
      <input matInput formControlName="titolo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Anno pubblicazione</mat-label>
      <input matInput formControlName="annoPubblic">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Edizione</mat-label>
      <input matInput formControlName="edizione">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Lingua</mat-label>
      <input matInput formControlName="lingua">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Casa editrice</mat-label>
      <input matInput formControlName="casaEditrice">
    </mat-form-field>

    <div class="separatore"></div>
    <span class="etichetta-sezione">Autore</span>

    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cognome</mat-label>
      <input matInput formControlName="cognome">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onAnnulla()">Annulla</button>
  <button mat-raised-button color="primary" type="submit" form="formLibro">Salva</button>
</mat-dialog-actions>
